<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 날씨 현황</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="student-badge">
        <span class="s-label">학번</span>
        <span class="s-val" id="student-id">1115</span>
        <span class="s-dot">·</span>
        <span class="s-label">이름</span>
        <span class="s-val" id="student-name">정동희</span>
      </div>
      <div class="header-title">
        <h1>실시간 <em>날씨</em> 현황</h1>
        <p class="header-sub">Live Weather Dashboard · Open-Meteo API</p>
      </div>
    </div>
  </header>

  <section class="search-section">
    <div class="search-inner">
      <div class="search-row">
        <input type="text" id="city-input" class="city-input" placeholder="도시 이름 입력 (예: 서울, 부산, 대구...)" />
        <button id="search-btn" class="search-btn">검색</button>
      </div>
      <div class="preset-cities">
  <button class="preset-btn" data-city="서울">서울</button>
  <button class="preset-btn" data-city="부산">부산</button>
  <button class="preset-btn" data-city="대구">대구</button>
  <button class="preset-btn" data-city="인천">인천</button>
  <button class="preset-btn" data-city="제주">제주</button>
  <button class="preset-btn" data-city="영천">영천</button>
  <button class="preset-btn" data-city="전주">전주</button>
  <button class="preset-btn" data-city="익산">익산</button>
  <button class="preset-btn" data-city="춘천">춘천</button>
  <button class="preset-btn" data-city="포항">포항</button>
</div>
    </div>
  </section>

  <main class="main">
    <div id="weather-container" class="weather-container hidden">
      <div class="current-card">
        <div class="city-name" id="city-name">—</div>
        <div class="weather-icon" id="weather-icon">☀️</div>
        <div class="temp-big" id="temp-big">—°C</div>
        <div class="weather-desc" id="weather-desc">—</div>
        <div class="updated" id="updated-time">—</div>
      </div>

      <div class="detail-grid">
        <div class="detail-card">
          <div class="detail-icon">💧</div>
          <div class="detail-label">습도</div>
          <div class="detail-val" id="humidity">—</div>
        </div>
        <div class="detail-card">
          <div class="detail-icon">🌬️</div>
          <div class="detail-label">풍속</div>
          <div class="detail-val" id="wind">—</div>
        </div>
        <div class="detail-card">
          <div class="detail-icon">🌡️</div>
          <div class="detail-label">체감온도</div>
          <div class="detail-val" id="feels-like">—</div>
        </div>
        <div class="detail-card">
          <div class="detail-icon">☁️</div>
          <div class="detail-label">구름량</div>
          <div class="detail-val" id="cloud">—</div>
        </div>
        <div class="detail-card">
          <div class="detail-icon">🌧️</div>
          <div class="detail-label">강수량</div>
          <div class="detail-val" id="rain">—</div>
        </div>
        <div class="detail-card">
          <div class="detail-icon">👁️</div>
          <div class="detail-label">가시거리</div>
          <div class="detail-val" id="visibility">—</div>
        </div>
      </div>

      <div class="hourly-section">
        <h2 class="section-title">시간별 예보</h2>
        <div class="hourly-scroll">
          <div id="hourly-list" class="hourly-list"></div>
        </div>
      </div>
    </div>

    <div id="status-area" class="status-area">
      <div class="status-icon">🌤️</div>
      <p id="status-msg">도시를 검색하거나 위에서 선택하세요</p>
    </div>
  </main>

  <footer class="footer">
    <p>데이터 출처: <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> (무료 오픈 날씨 API)</p>
    <p class="footer-copy">© 2026 학번: <span>1115</span> / 정동희</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
